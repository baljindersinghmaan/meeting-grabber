<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meet Caption Grabber</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-size: 12px; margin: 0 0 4px; opacity: 0.8; }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .row { display: flex; gap: 8px; margin-bottom: 10px; }
    button {
      flex: 1;
      padding: 8px 6px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid rgba(128,128,128,0.4);
      border-radius: 6px;
      background: rgba(128,128,128,0.08);
    }
    button:disabled { opacity: 0.45; cursor: default; }
    #start { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    #stop  { background: #d93025; color: #fff; border-color: #d93025; }
    .opt {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin: 0 0 10px;
      opacity: 0.85;
    }
    .opt input { margin: 0; }
    details.settings {
      margin: 0 0 10px;
      font-size: 12px;
    }
    details.settings > summary {
      cursor: pointer;
      padding: 4px 0;
      opacity: 0.85;
      user-select: none;
    }
    details.settings > summary::marker { color: rgba(128,128,128,0.6); }
    details.settings .hint {
      font-size: 11px;
      opacity: 0.7;
      margin: -4px 0 2px;
      line-height: 1.4;
    }
    details.settings a { color: #1a73e8; }
    #status {
      font-size: 12px;
      min-height: 32px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(128,128,128,0.10);
      white-space: pre-wrap;
    }
    .warn { color: #d93025; }
    .ok { color: #188038; }
  </style>
</head>
<body>
  <h1>Meet Caption Grabber</h1>

  <label for="name">Transcript name</label>
  <input type="text" id="name" placeholder="e.g. weekly-standup" />

  <div class="row">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>
  <div class="row">
    <button id="download">Download</button>
  </div>

  <label class="opt">
    <input type="checkbox" id="saveRaw" />
    Also save raw transcript (.txt)
  </label>

  <details class="settings" id="settings">
    <summary>⚙️ Settings</summary>
    <label for="apiKey">Groq API key</label>
    <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" spellcheck="false" />
    <div class="hint">
      Free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.
      Captions are sent to Groq's API for summarization.
    </div>
  </details>

  <div id="status">Idle. Turn on captions (CC) in Meet, then click Start.</div>

  <script src="popup.js"></script>
</body>
</html>
